[project]
name = "edgar-mcp"
version = "0.1.0"
description = "MCP server for SEC EDGAR filings and XBRL financial facts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp[cli]>=2.1.1", "httpx>=0.27"]

[project.scripts]
edgar-mcp = "edgar_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
